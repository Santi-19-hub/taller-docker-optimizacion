version: '3.8'

networks:
  app-net:
    driver: bridge

volumes:
  gpdata:

services:
  db:
    image: postgres:15-alpine
    container_name: db
    networks:
      - app-net
    volumes:
      - gpdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: secret

  api:
    image: node:22-alpine
    container_name: api
    networks:
      - app-net
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    command: tail -f /dev/null

  web:
    image: nginx:latest
    container_name: web
    networks:
      - app-net
    ports:
      - "5000:5000"